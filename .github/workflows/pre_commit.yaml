on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

name: pre-commit

permissions: {}

jobs:
  pre-commit:
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # credentials needed by git-auto-commit-action to push autofixes
        with: # zizmor: ignore[artipacked]
          ref: ${{ github.head_ref }}

      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          # only run the pre-commit config in the project root, not in templates
          extra-args: "--all-files --config ./.pre-commit-config.yaml"

      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        if: "!cancelled()"
        with:
          commit_message: pre-commit autofixes

name: "Build docs using sphinx"
on:
  push:
    branches:
      - main
  pull_request:
    # also run on 'closed' to clean up the github pages dir
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: preview-${{ github.ref }}

permissions: {}

jobs:
  docs:
    name: "Build Docs"
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to gh-pages
      pull-requests: write # PR preview comment

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: "Install hatch"
        run: pip install hatch

      - name: "Build docs with Sphinx"
        run: hatch run docs:build -W --keep-going

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: docs/_build/html

      - name: Deploy docs
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: docs/_build/html
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
